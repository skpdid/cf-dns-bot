name = "long-heart-857b"
main = "worker.js"
compatibility_date = "2025-01-01"

# Durable Object binding — menyimpan akun Cloudflare + sesi wizard per user.
[[durable_objects.bindings]]
name = "USERBOT"
class_name = "UserBot"

# Migration: SQLite-backed DO (wajib untuk akun free plan).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserBot"]

# Secret TIDAK ditulis di sini. Set lewat dashboard atau:
#   wrangler secret put BOT_TOKEN
#   wrangler secret put WEBHOOK_SECRET
#   wrangler secret put ENCRYPTION_KEY
